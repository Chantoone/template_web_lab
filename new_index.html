<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CORE Lab — Computer Vision and Retrieval research at UIT, VNU-HCM.">
  <title>CORE Lab — Computer Vision &amp; Retrieval</title>
  <style>
    :root {
      --ink: #09090b;
      --muted: #45454d;
      --line: rgba(9, 9, 11, .14);
      --panel: #081225;
      --blue: #3388ff;
      --pink: #ee49be;
      --orange: #ff8b16;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 23% 22%, rgba(146, 188, 255, .34), transparent 34%),
        radial-gradient(circle at 78% 31%, rgba(244, 164, 232, .42), transparent 36%),
        linear-gradient(135deg, #f7fbff 0%, #fff9fd 68%, #fff 100%);
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    a:focus-visible, button:focus-visible {
      outline: 3px solid #4e87ff;
      outline-offset: 4px;
    }

    .hero {
      position: relative;
      display: grid;
      place-items: center;
      align-items: center;
      min-height: 100dvh;
      padding: clamp(28px, 3vw, 52px);
      overflow: hidden;
      isolation: isolate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 1px;
      background: var(--line);
    }

    .copy { max-width: 780px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(30px, 4vw, 56px);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(124, 138, 158, .18);
      font-size: clamp(14px, 1.15vw, 18px);
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(62px, 7vw, 126px);
      font-weight: 500;
      line-height: .91;
      letter-spacing: -.072em;
      text-wrap: balance;
    }

    .intro {
      max-width: 770px;
      margin: clamp(34px, 4vw, 58px) 0 0;
      color: var(--muted);
      font-size: clamp(18px, 1.45vw, 28px);
      line-height: 1.55;
      letter-spacing: -.025em;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: clamp(34px, 4vw, 54px);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 0 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,.64);
      text-decoration: none;
      font-size: clamp(17px, 1.2vw, 23px);
      font-weight: 600;
      transition: transform .25s var(--ease), background .25s, color .25s;
    }

    .button:hover { transform: translateY(-3px); }
    .button.primary { color: #fff; background: #08080a; border-color: #08080a; }
    .button.primary:hover { background: #29292d; }

    .event {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: clamp(42px, 5vw, 68px);
      padding: 14px 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.43);
      box-shadow: inset 0 1px rgba(255,255,255,.7);
    }

    .event-badge {
      padding: 8px 13px;
      border-radius: 6px;
      color: #fff;
      background: #09090b;
      font-size: 14px;
      font-weight: 700;
    }

    .event-name { font-size: 17px; font-weight: 650; }
    .event-date { color: #7b7b80; font-weight: 500; }
    .countdown { display: flex; gap: 13px; margin-left: 8px; }
    .time { min-width: 32px; text-align: center; }
    .time strong { display: block; font: 500 20px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .time small { color: #88888e; font-size: 10px; text-transform: uppercase; }

    .demo-wrap { position: relative; width: min(100%, 700px); }
    .demo-glow {
      position: absolute;
      inset: 6% -5% -8%;
      z-index: -1;
      border-radius: 48px;
      background: linear-gradient(135deg, rgba(60,132,255,.32), rgba(231,62,203,.34));
      filter: blur(52px);
    }

    .demo {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 1px solid rgba(128, 164, 221, .36);
      border-radius: 24px;
      color: #c3d8ff;
      background: var(--panel);
      box-shadow: 0 36px 72px rgba(14, 12, 34, .28);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .83; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(2,11,29,.16), rgba(2,8,22,.04) 57%, rgba(5,8,22,.26)); }
    .grid {
      position: absolute; inset: 0; opacity: .24;
      background-image: linear-gradient(rgba(110,151,225,.4) 1px, transparent 1px), linear-gradient(90deg, rgba(110,151,225,.4) 1px, transparent 1px);
      background-size: 11.1% 11.1%;
    }

    .hud-top, .hud-bottom {
      position: absolute;
      z-index: 5;
      left: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(190,211,248,.72);
      font-size: clamp(9px, .9vw, 14px);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .hud-top { top: 25px; }
    .hud-bottom { bottom: 22px; }
    .record { display: flex; align-items: center; gap: 10px; }
    .record::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #ff4f77; box-shadow: 0 0 12px #ff4f77; }

    .phase {
      position: absolute;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity .55s var(--ease), transform .65s var(--ease);
    }

    .query-card {
      top: 12%; left: 4%;
      width: min(52%, 420px);
      padding: 18px 22px;
      border: 1px solid rgba(122,162,225,.34);
      border-radius: 14px;
      background: rgba(8,24,53,.88);
      box-shadow: 0 14px 36px rgba(2,8,23,.24);
      transform: translateY(-10px);
    }
    .query-label, .output-label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: #84a3d5; font-size: clamp(9px, 1vw, 14px); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .query-label svg, .output-label svg { width: 24px; height: 24px; color: var(--blue); flex: none; }
    .query-card p, .output-card p { margin: 0; font-size: clamp(10px, 1.15vw, 17px); line-height: 1.6; }

    .scan-line {
      position: absolute; z-index: 3; top: 10%; bottom: 9%; left: 8%; width: 2px;
      background: linear-gradient(transparent, #67b5ff 22%, #fff 50%, #67b5ff 78%, transparent);
      opacity: 0; box-shadow: 0 0 18px #4d9dff;
    }

    .detect { inset: 0; }
    .box { position: absolute; border: 3px solid var(--box-color); border-radius: 2px; filter: drop-shadow(0 0 7px rgba(70,130,255,.34)); }
    .box::before { content: attr(data-label); position: absolute; top: -35px; left: -3px; padding: 7px 11px; border-radius: 7px 7px 7px 0; color: #fff; background: var(--box-color); white-space: nowrap; font-size: clamp(9px, 1.15vw, 18px); font-weight: 700; }
    .car { --box-color: var(--blue); left: 7%; bottom: 17%; width: 32%; height: 28%; }
    .person { --box-color: var(--orange); right: 15%; bottom: 17%; width: 16%; height: 27%; }
    .result { inset: 0; }
    .output-card, .concepts {
      right: 3.5%;
      width: 32%;
      padding: 18px;
      border: 1px solid rgba(118,151,201,.3);
      border-radius: 14px;
      background: rgba(6,17,37,.91);
      box-shadow: 0 18px 40px rgba(1,6,18,.24);
      transform: translateX(12px);
    }
    .output-card {
      position: absolute;
      top: 50%;
      right: -224px;
      width: 208px;
      padding: 13px;
      border-radius: 10px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transform: translate(10px, -50%) scale(.96);
      transition: opacity .5s var(--ease), transform .55s var(--ease);
      color: #c3d8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .output-card .output-label {
      gap: 6px;
      margin-bottom: 6px;
      font-size: clamp(7px, .75vw, 11px);
      letter-spacing: .1em;
    }
    .output-card .output-label svg { width: 17px; height: 17px; }
    .output-card p { font-size: clamp(8px, .8vw, 12px); line-height: 1.45; }
    .demo-wrap.result-visible > .output-card { opacity: 1; transform: translateY(-50%); }
    .compact-concepts {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(126, 158, 210, .22);
    }
    .compact-concepts .concept-title { margin-bottom: 8px; color: #84a3d5; font-size: 9px; }
    .compact-concepts .metric { margin-top: 7px; font-size: 9px; }
    .compact-concepts .dot { width: 7px; height: 7px; }
    .compact-concepts .bar { height: 4px; }
    .concepts { bottom: 13%; }
    .concept-title { margin-bottom: 12px; color: #829bc5; font-size: clamp(8px, .9vw, 13px); font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .metric { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; margin-top: 10px; font-size: clamp(8px, .9vw, 13px); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
    .bar { grid-column: 2 / 4; height: 7px; overflow: hidden; border-radius: 9px; background: rgba(159,180,217,.13); }
    .bar i { display: block; width: var(--w); height: 100%; border-radius: inherit; background: var(--c); transform-origin: left; }

    .demo[data-step="query"] .query-card,
    .demo[data-step="scan"] .query-card,
    .demo[data-step="scan"] .scan-line,
    .demo[data-step="result"] .detect,
    .demo[data-step="result"] .output-card,
    .demo[data-step="result"] .concepts { opacity: 1; transform: none; }
    .demo[data-step="scan"] .scan-line { animation: scan 1.1s ease-in-out infinite; }
    .demo[data-step="result"] .query-card { opacity: .58; transform: scale(.86); transform-origin: top left; }
    .demo[data-step="result"] .bar i { animation: grow .8s var(--ease) both; }

    @keyframes scan { 0%,100% { transform: translateX(0); } 50% { transform: translateX(660px); } }
    @keyframes grow { from { transform: scaleX(0); } }

    @media (max-width: 1120px) {
      .hero { min-height: 100dvh; }
      .demo-wrap { width: min(100%, 700px); }
    }

    @media (max-width: 980px) {
      .demo-wrap { margin-bottom: 210px; }
      .demo-wrap > .output-card {
        top: calc(100% + 14px);
        right: 0;
        width: 208px;
        transform: translateY(8px) scale(.96);
      }
      .demo-wrap.result-visible > .output-card { transform: none; }
    }

    @media (max-width: 620px) {
      .hero { gap: 48px; padding: 38px 18px 64px; }
      h1 { font-size: clamp(51px, 17vw, 74px); }
      .intro { font-size: 18px; }
      .actions { display: grid; }
      .button { min-height: 56px; }
      .event { display: grid; grid-template-columns: auto 1fr; width: 100%; gap: 12px; padding: 16px; }
      .countdown { grid-column: 1 / -1; margin: 4px 0 0; justify-content: space-between; }
      .demo { border-radius: 14px; }
      .hud-top, .hud-bottom { left: 13px; right: 13px; }
      .hud-top { top: 12px; }
      .hud-bottom { bottom: 10px; }
      .query-card { padding: 10px 12px; }
      .output-card, .concepts { padding: 9px; }
      .demo-wrap { margin-bottom: 194px; }
      .demo-wrap > .output-card { top: calc(100% + 12px); right: 0; width: 168px; }
      .query-label, .output-label { margin-bottom: 4px; }
      .output-label svg, .query-label svg { width: 14px; height: 14px; }
      .metric { margin-top: 5px; gap: 5px; }
      .bar { height: 4px; }
      .box { border-width: 2px; }
      .box::before { top: -24px; padding: 5px 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="demo-wrap" aria-label="Interactive vision-language reasoning demonstration">
      <div class="demo-glow" aria-hidden="true"></div>
      <div class="demo" id="vision-demo" data-step="query" aria-live="polite">
        <img class="scene" src="test_img/Unknown-8.png" width="1448" height="1086" alt="A car and a pedestrian on a city street at night">
        <div class="shade" aria-hidden="true"></div>
        <div class="grid" aria-hidden="true"></div>
        <div class="hud-top"><span>Vision-language reasoning</span><span class="record">REC</span></div>
        <div class="hud-bottom"><span id="demo-status">Receiving user query</span><span>Realtime</span></div>

        <article class="phase query-card">
          <div class="query-label">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.7 1.5 5.1 3.9 6.7L5 22l4.2-2.1c.9.2 1.8.3 2.8.3 5.5 0 10-3.8 10-8.6S17.5 3 12 3Zm-4 10a1.3 1.3 0 1 1 0-2.6A1.3 1.3 0 0 1 8 13Zm4 0a1.3 1.3 0 1 1 0-2.6A1.3 1.3 0 0 1 12 13Zm4 0a1.3 1.3 0 1 1 0-2.6A1.3 1.3 0 0 1 16 13Z"/></svg>
            User query
          </div>
          <p>What is happening in the scene?<br>Describe the objects and the environment.</p>
        </article>

        <div class="scan-line" aria-hidden="true"></div>
        <div class="phase detect" aria-hidden="true">
          <div class="box car" data-label="object 0.93"></div>
          <div class="box person" data-label="track 0.87"></div>
        </div>

      </div>
      <article class="output-card" aria-live="polite">
        <div class="output-label">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5c.6 5.3 3.2 7.9 8.5 8.5-5.3.6-7.9 3.2-8.5 8.5-.6-5.3-3.2-7.9-8.5-8.5C8.8 9.4 11.4 6.8 12 1.5Zm7.5 0c.2 1.8 1.2 2.8 3 3-1.8.2-2.8 1.2-3 3-.2-1.8-1.2-2.8-3-3 1.8-.2 2.8-1.2 3-3Z"/></svg>
          Reasoning output
        </div>
        <p>A car is driving on a wet city road while a pedestrian crosses the street.</p>
        <div class="compact-concepts">
          <div class="concept-title">Retrieved concepts</div>
          <div class="metric" style="--c: var(--blue); --w: 93%"><i class="dot"></i><span>object (car)</span><span>0.93</span><span class="bar"><i></i></span></div>
          <div class="metric" style="--c: var(--orange); --w: 87%"><i class="dot"></i><span>track (person)</span><span>0.87</span><span class="bar"><i></i></span></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    (() => {
      const demo = document.getElementById('vision-demo');
      const status = document.getElementById('demo-status');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const steps = ['query', 'scan', 'result'];
      const labels = { query: 'Receiving user query', scan: 'Analyzing visual features', result: 'Reasoning complete' };
      let index = 0;
      let timer;

      function render(step) {
        index = steps.indexOf(step);
        demo.dataset.step = step;
        demo.parentElement.classList.toggle('result-visible', step === 'result');
        status.textContent = labels[step];
      }

      function schedule(delay = 1400) {
        clearTimeout(timer);
        timer = setTimeout(() => {
          render(steps[(index + 1) % steps.length]);
          schedule(index === 2 ? 2800 : 1500);
        }, delay);
      }

      render('query');
      schedule(reducedMotion ? 2500 : 1400);
    })();
  </script>
</body>
</html>
